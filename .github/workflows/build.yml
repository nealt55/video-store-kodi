name: Build Video Store Kodi Skin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Download base skin
        run: |
          curl -fL --retry 3 -o base.zip https://mirrors.mit.edu/kodi/addons/piers/skin.arctic.zephyr.mod/skin.arctic.zephyr.mod-3.0.3.zip
          rm -rf build
          mkdir -p build
          unzip -q base.zip -d build
          BASE_DIR=$(find build -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$BASE_DIR"
          mv "$BASE_DIR" build/skin.video.store
      - name: Apply Video Store customisations
        shell: bash
        run: |
          cp custom/skin.video.store/addon.xml build/skin.video.store/addon.xml
          cp custom/skin.video.store/1080i/Home.xml build/skin.video.store/1080i/Home.xml
          cp custom/skin.video.store/icon.png build/skin.video.store/icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/skin.video.store/1080i/Includes_Furniture.xml')
          t=p.read_text(encoding='utf-8')
          block=Path('custom/clock_block.xml').read_text(encoding='utf-8')
          anchor='            <control type="label">\n                <centertop>92</centertop>\n                <right>SidePad</right>'
          if 'VIDEO STORE NEON CLOCK' in t:
              raise SystemExit('Clock block already present in base skin; refusing duplicate insertion')
          if t.count(anchor) != 1:
              raise SystemExit(f'Clock insertion anchor count is {t.count(anchor)}, expected 1')
          p.write_text(t.replace(anchor, block+'\n\n'+anchor, 1), encoding='utf-8')
          PY
          mkdir -p build/skin.video.store/media
          cp custom/video_store_background.jpg build/skin.video.store/media/video_store_background.jpg
          cp custom/neon-clock-panel.png build/skin.video.store/media/neon-clock-panel.png
      - name: Validate addon and build version
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          x=Path('build/skin.video.store/addon.xml').read_text()
          m=re.search(r'<addon\s+id="skin\.video\.store"\s+version="([^"]+)"', x)
          if not m or m.group(1) != v:
              raise SystemExit(f'Version mismatch: VERSION={v}, addon.xml={m.group(1) if m else "MISSING"}')
          if 'version="3.0.3"' in x:
              raise SystemExit('Old Arctic Zephyr version detected in Video Store addon.xml')
          print(f'Validated Video Store version {v}')
          PY
          test -f build/skin.video.store/icon.png
          test -f build/skin.video.store/media/video_store_background.jpg
          test -f build/skin.video.store/media/neon-clock-panel.png
      - name: Build skin ZIP
        shell: bash
        run: |
          mkdir -p dist
          cd build
          zip -qr "../dist/skin.video.store-${VERSION}.zip" skin.video.store
          cd ..
          unzip -p "dist/skin.video.store-${VERSION}.zip" skin.video.store/addon.xml > /tmp/built-addon.xml
          grep -q "id=\"skin.video.store\" version=\"${VERSION}\"" /tmp/built-addon.xml
          test "$(unzip -l "dist/skin.video.store-${VERSION}.zip" | grep -c 'skin.video.store/addon.xml')" -eq 1
          sha256sum "dist/skin.video.store-${VERSION}.zip" > dist/SHA256SUMS
      - name: Build Kodi repository metadata and installer
        shell: bash
        run: |
          mkdir -p dist/repository
          cat > dist/repository/addons.xml <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addons>
              <addon id="skin.video.store" name="Video Store" version="${VERSION}" provider-name="Video Store">
                  <requires>
                      <import addon="xbmc.gui" version="5.17.0" />
                  </requires>
                  <extension point="xbmc.gui.skin" />
                  <extension point="xbmc.addon.metadata">
                      <summary>Retro neon VHS rental-store skin</summary>
                      <description>A custom Kodi skin inspired by an old-school video rental store.</description>
                      <platform>all</platform>
                  </extension>
              </addon>
          </addons>
          EOF
          md5sum dist/repository/addons.xml | cut -d' ' -f1 > dist/repository/addons.xml.md5
          cp "dist/skin.video.store-${VERSION}.zip" "dist/repository/skin.video.store-${VERSION}.zip"
          cat > /tmp/repository-addon.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addon id="repository.video.store" name="Video Store Repository" version="1.0.0" provider-name="Video Store">
              <extension point="xbmc.addon.repository" name="Video Store Repository">
                  <dir>
                      <info compressed="false">https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml</info>
                      <checksum>https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml.md5</checksum>
                      <datadir zip="true">https://github.com/nealt55/video-store-kodi/raw/refs/heads/main/dist/repository</datadir>
                  </dir>
              </extension>
              <extension point="xbmc.addon.metadata">
                  <summary>Video Store Kodi skin repository</summary>
                  <description>Repository for the Video Store retro neon VHS rental-store Kodi skin.</description>
                  <platform>all</platform>
              </extension>
          </addon>
          EOF
          mkdir -p dist/repository-installer/repository.video.store
          cp /tmp/repository-addon.xml dist/repository-installer/repository.video.store/addon.xml
          (cd dist/repository-installer && zip -qr "../repository.video.store-1.0.0.zip" repository.video.store)
          rm -rf dist/repository-installer
          unzip -p "dist/repository.video.store-1.0.0.zip" repository.video.store/addon.xml > /tmp/repo-addon.xml
          grep -q 'id="repository.video.store" name="Video Store Repository" version="1.0.0"' /tmp/repo-addon.xml
          test -f "dist/repository/skin.video.store-${VERSION}.zip"
          test "$(unzip -l "dist/repository/skin.video.store-${VERSION}.zip" | grep -c 'skin.video.store/addon.xml')" -eq 1
      - name: Publish repository files to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/repository
          if git diff --cached --quiet; then
            echo "Repository files already current"
          else
            git commit -m "Publish Video Store ${VERSION} Kodi repository"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-store-${{ env.VERSION }}
          path: |
            dist/skin.video.store-${{ env.VERSION }}.zip
            dist/repository.video.store-1.0.0.zip
            dist/SHA256SUMS
