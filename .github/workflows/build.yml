name: Build Video Store Kodi Skin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepare pinned base skin
        shell: bash
        run: |
          set -e
          test -f skin.arctic.zephyr.mod-master.zip
          test "$(stat -c%s skin.arctic.zephyr.mod-master.zip)" -gt 50000000
          rm -rf build
          mkdir -p build
          unzip -q skin.arctic.zephyr.mod-master.zip -d build
          BASE_DIR=$(find build -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$BASE_DIR"
          mv "$BASE_DIR" build/skin.video.store
          test -f build/skin.video.store/addon.xml
          grep -q 'id="skin.arctic.zephyr.mod"' build/skin.video.store/addon.xml
          grep -q 'version="3.0.3"' build/skin.video.store/addon.xml
          echo "Using the pinned original Arctic Zephyr 3.0.3 ZIP stored in this repository."
      - name: Apply Video Store background only
        shell: bash
        run: |
          cp custom/skin.video.store/addon.xml build/skin.video.store/addon.xml
          cp custom/skin.video.store/1080i/Home.xml build/skin.video.store/1080i/Home.xml
          cp custom/skin.video.store/icon.png build/skin.video.store/icon.png
          mkdir -p build/skin.video.store/media
          cp custom/video_store_background.jpg build/skin.video.store/media/video_store_background.jpg
      - name: Validate addon and background-only build
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          x=Path('build/skin.video.store/addon.xml').read_text()
          m=re.search(r'<addon\s+id="skin\.video\.store"\s+version="([^"]+)"', x)
          if not m or m.group(1) != v:
              raise SystemExit(f'Version mismatch: VERSION={v}, addon.xml={m.group(1) if m else "MISSING"}')
          home=Path('build/skin.video.store/1080i/Home.xml').read_text()
          if 'special://skin/media/video_store_background.jpg' not in home:
              raise SystemExit('Video Store background is not referenced by Home.xml')
          furniture=Path('build/skin.video.store/1080i/Includes_Furniture.xml').read_text()
          if 'VIDEO STORE NEON CLOCK' in furniture:
              raise SystemExit('Clock customisation must NOT be present in the background-only build')
          if 'System.Time' not in furniture or 'System.Date' not in furniture:
              raise SystemExit('Original Arctic Zephyr clock/date controls are missing')
          print(f'Validated background-only Video Store version {v}')
          PY
          test -f build/skin.video.store/icon.png
          test -f build/skin.video.store/media/video_store_background.jpg
      - name: Build skin ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cd build
          zip -qr "../dist/skin.video.store-${VERSION}.zip" skin.video.store
          cd ..
          unzip -p "dist/skin.video.store-${VERSION}.zip" skin.video.store/addon.xml > /tmp/built-addon.xml
          grep -q "id=\"skin.video.store\" version=\"${VERSION}\"" /tmp/built-addon.xml
          test "$(unzip -l "dist/skin.video.store-${VERSION}.zip" | grep -c 'skin.video.store/addon.xml')" -eq 1
          test "$(unzip -l "dist/skin.video.store-${VERSION}.zip" | grep -c 'skin.video.store/media/video_store_background.jpg')" -eq 1
          test "$(unzip -l "dist/skin.video.store-${VERSION}.zip" | grep -c 'skin.video.store/1080i/Includes_Furniture.xml')" -eq 1
          sha256sum "dist/skin.video.store-${VERSION}.zip" > dist/SHA256SUMS
      - name: Build Kodi repository metadata and installer
        shell: bash
        run: |
          mkdir -p dist/repository/skin.video.store
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          addon = ET.parse('build/skin.video.store/addon.xml').getroot()
          root = ET.Element('addons')
          root.append(addon)
          ET.ElementTree(root).write('dist/repository/addons.xml', encoding='UTF-8', xml_declaration=True)
          PY
          md5sum dist/repository/addons.xml | cut -d' ' -f1 > dist/repository/addons.xml.md5
          cp "dist/skin.video.store-${VERSION}.zip" "dist/repository/skin.video.store/skin.video.store-${VERSION}.zip"
          cat > /tmp/repository-addon.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addon id="repository.video.store" name="Video Store Repository" version="1.0.0" provider-name="Video Store">
              <extension point="xbmc.addon.repository" name="Video Store Repository">
                  <dir>
                      <info compressed="false">https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml</info>
                      <checksum>https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml.md5</checksum>
                      <datadir zip="true">https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/</datadir>
                  </dir>
              </extension>
              <extension point="xbmc.addon.metadata">
                  <summary>Video Store Kodi skin repository</summary>
                  <description>Repository for the Video Store retro neon VHS rental-store Kodi skin.</description>
                  <platform>all</platform>
              </extension>
          </addon>
          EOF
          rm -rf dist/repository-installer
          mkdir -p dist/repository-installer/repository.video.store
          cp /tmp/repository-addon.xml dist/repository-installer/repository.video.store/addon.xml
          (cd dist/repository-installer && zip -qr "../repository.video.store-1.0.0.zip" repository.video.store)
          rm -rf dist/repository-installer
          unzip -p "dist/repository.video.store-1.0.0.zip" repository.video.store/addon.xml > /tmp/repo-addon.xml
          grep -q 'id="repository.video.store" name="Video Store Repository" version="1.0.0"' /tmp/repo-addon.xml
          test -f "dist/repository/addons.xml"
          test -f "dist/repository/addons.xml.md5"
          test -f "dist/repository/skin.video.store/skin.video.store-${VERSION}.zip"
          grep -q "id=\"skin.video.store\" version=\"${VERSION}\"" dist/repository/addons.xml
          test "$(cat dist/repository/addons.xml.md5)" = "$(md5sum dist/repository/addons.xml | cut -d' ' -f1)"
      - name: Publish repository files to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/repository
          if git diff --cached --quiet; then
            echo "Repository files already current"
          else
            git commit -m "Publish Video Store ${VERSION} Kodi repository"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: video-store-${{ env.VERSION }}
          path: |
            dist/skin.video.store-${{ env.VERSION }}.zip
            dist/repository.video.store-1.0.0.zip
            dist/SHA256SUMS
