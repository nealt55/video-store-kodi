name: Build Video Store Kodi Skin

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build skin
        shell: bash
        run: |
          set -e
          rm -rf build dist
          mkdir -p build dist
          unzip -q skin.arctic.zephyr.mod-master.zip -d build
          BASE_DIR=$(find build -mindepth 1 -maxdepth 1 -type d | head -n 1)
          mv "$BASE_DIR" build/skin.video.store

          cp custom/skin.video.store/addon.xml build/skin.video.store/addon.xml
          cp custom/skin.video.store/icon.png build/skin.video.store/icon.png
          mkdir -p build/skin.video.store/media
          cp custom/video_store_background.jpg build/skin.video.store/media/video_store_background.jpg

          grep -q "id=\"skin.video.store\"" build/skin.video.store/addon.xml
          grep -q "version=\"${VERSION}\"" build/skin.video.store/addon.xml
          test -f build/skin.video.store/media/video_store_background.jpg
          grep -q 'video_store_background.jpg' build/skin.video.store/1080i/Home.xml

          (cd build && zip -qr "../dist/skin.video.store-${VERSION}.zip" skin.video.store)

          mkdir -p dist/repository/skin.video.store
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          addon = ET.parse('build/skin.video.store/addon.xml').getroot()
          root = ET.Element('addons')
          root.append(addon)
          ET.ElementTree(root).write('dist/repository/addons.xml', encoding='UTF-8', xml_declaration=True)
          PY
          md5sum dist/repository/addons.xml | cut -d' ' -f1 > dist/repository/addons.xml.md5
          cp "dist/skin.video.store-${VERSION}.zip" "dist/repository/skin.video.store/skin.video.store-${VERSION}.zip"

          mkdir -p dist/repository-installer/repository.video.store
          cat > dist/repository-installer/repository.video.store/addon.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addon id="repository.video.store" name="Video Store Repository" version="1.0.0" provider-name="Video Store">
            <extension point="xbmc.addon.repository" name="Video Store Repository">
              <dir>
                <info compressed="false">https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml</info>
                <checksum>https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/addons.xml.md5</checksum>
                <datadir zip="true">https://raw.githubusercontent.com/nealt55/video-store-kodi/main/dist/repository/</datadir>
              </dir>
            </extension>
            <extension point="xbmc.addon.metadata">
              <summary>Video Store Kodi skin repository</summary>
              <description>Retro neon VHS rental-store themed Kodi skin.</description>
              <platform>all</platform>
            </extension>
          </addon>
          EOF
          (cd dist/repository-installer && zip -qr "../repository.video.store-1.0.0.zip" repository.video.store)
          rm -rf dist/repository-installer
          sha256sum "dist/skin.video.store-${VERSION}.zip" > dist/SHA256SUMS

      - name: Publish repository files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/repository
          if ! git diff --cached --quiet; then
            git commit -m "Publish Video Store ${VERSION} repository"
            git fetch origin main
            git merge origin/main --no-edit -X ours
            git push
          fi

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-store-${{ env.VERSION }}
          path: |
            dist/skin.video.store-${{ env.VERSION }}.zip
            dist/repository.video.store-1.0.0.zip
            dist/SHA256SUMS
